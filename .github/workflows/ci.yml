name: ci

on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}

# The jobs follow docs/contract/testing.md section 9. Hosted runners have no GPU:
# GPU code runs on Windows' software D3D12 adapter (WARP) and on Mesa's lavapipe.
# That proves correctness on each backend, not speed on real hardware.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      # The verdicts of the launch check the jobs below run (testing.md 9.1).
      - run: node --test .github/scripts/launch-check.test.mjs
      # A pull request stays inside the folders its branch names the owner of (testing.md 7.1).
      - if: github.event_name == 'pull_request'
        run: node tests/tools/ownership.ts

  # The type check and the unit layer once more, on Windows: path separators, drive letters and the temporary
  # folder are Windows' own there. .gitattributes keeps the line ends of the checkout as the repository stores
  # them; converted to CRLF, the tests that read the contract's Markdown fail. Not required to merge until it has
  # passed here (testing.md 9.1).
  unit-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: node --test .github/scripts/launch-check.test.mjs

  gpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The suite is split by test file (node --test-shard): on the software adapters one job
          # no longer finishes in time. Windows' adapter is the slower one and gets more shards.
          - { name: gpu-linux-1, os: ubuntu-latest, adapter: llvmpipe, shard: 1/2 }
          - { name: gpu-linux-2, os: ubuntu-latest, adapter: llvmpipe, shard: 2/2 }
          - { name: gpu-windows-1, os: windows-latest, adapter: Microsoft, shard: 1/4 }
          - { name: gpu-windows-2, os: windows-latest, adapter: Microsoft, shard: 2/4 }
          - { name: gpu-windows-3, os: windows-latest, adapter: Microsoft, shard: 3/4 }
          - { name: gpu-windows-4, os: windows-latest, adapter: Microsoft, shard: 4/4 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      OROGEN_GPU_ADAPTER: ${{ matrix.adapter }}
      OROGEN_GPU_PROFILE: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: npm ci
      - run: npm run orogen -- probe
      - run: npm run test:gpu
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.name }}
          path: test-output
          if-no-files-found: ignore

  # The WGSL of every kernel against the compiler inside the Electron the product ships (testing.md 8.4). No GPU
  # and no display on the runner: a virtual display, and Electron's software adapter. Not required to merge
  # until it has passed reliably here (testing.md 9.3).
  electron-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      OROGEN_ELECTRON_GPU: software
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox uses.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      # The first start of the Electron binary on a runner is not a test's (testing.md 9.3): npm no longer fetches
      # the binary, so the first start downloads it, and on the one run on record the engine of that first start
      # was given no WebGPU adapter while the three starts after it were. This step is that first start. It says
      # what the engine found and whether a second start of the engine finds an adapter, with Chromium's own
      # output, and fails only when the window does not load.
      - name: First start of the application
        run: xvfb-run -a node .github/scripts/launch-check.mjs --result test-output/launch-check/first-start.json
        env:
          OROGEN_LAUNCH_CHECK_OUTPUT: '1'
      - run: xvfb-run -a npm run test:electron
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-electron-kernels
          path: test-output
          if-no-files-found: ignore

  # The Windows package, unsigned (testing.md 9.1): the application folder and the portable executable, each an
  # artifact of the run under its own name, and one start of the packaged application on the runner.
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - name: What the package holds
        shell: bash
        run: |
          ls -l release release/win-unpacked
          for file in Orogen.exe resources/app.asar; do
            test -f "release/win-unpacked/$file" || { echo "::error::release/win-unpacked/$file is missing from the package"; exit 1; }
          done
          # runtime.md 1.6 names these of the Electron distribution; one that is absent is said, and does not fail the job.
          for file in d3dcompiler_47.dll dxcompiler.dll dxil.dll; do
            test -f "release/win-unpacked/$file" || echo "::warning::release/win-unpacked/$file is not in the package (runtime.md 1.6 expects it of the Electron distribution)"
          done
      # The application folder, which GitHub hands out as one zip: unpack it and start Orogen.exe. It is what the
      # zip of `npm run dist:win` holds, without a zip inside a zip.
      - uses: actions/upload-artifact@v4
        with:
          name: Orogen-windows-x64
          path: release/win-unpacked
          if-no-files-found: error
      # One file: Orogen-<version>-win-x64-portable.exe.
      - uses: actions/upload-artifact@v4
        with:
          name: Orogen-windows-x64-portable
          path: release/*-portable.exe
          if-no-files-found: error
      # Test mode from the command line (testing.md 2.9): hidden, no dialog. The job fails when the packaged
      # application does not load its window.
      - name: Start the packaged application
        run: node .github/scripts/launch-check.mjs --app release/win-unpacked/Orogen.exe --result test-output/launch-check/packaged.json
      # Whether Electron offers a WebGPU adapter on a runner without a GPU is not yet known: said, not required.
      - name: Its engine opens a GPU device
        continue-on-error: true
        run: node .github/scripts/launch-check.mjs --read test-output/launch-check/packaged.json --require-device
      # The portable executable unpacks itself and starts the same application. Not required until it has passed here.
      - name: Start the portable executable
        continue-on-error: true
        shell: bash
        run: node .github/scripts/launch-check.mjs --app "$(ls release/*-portable.exe | head -n 1)" --result test-output/launch-check/portable.json --settle 120
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-check-windows
          path: test-output/launch-check
          if-no-files-found: ignore
