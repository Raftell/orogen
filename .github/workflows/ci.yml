name: ci

on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}

# The jobs follow docs/contract/testing.md section 9. Hosted runners have no GPU:
# GPU code runs on Windows' software D3D12 adapter (WARP) and on Mesa's lavapipe.
# That proves correctness on each backend, not speed on real hardware.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  gpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gpu-linux, os: ubuntu-latest, adapter: llvmpipe }
          - { name: gpu-windows, os: windows-latest, adapter: Microsoft }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OROGEN_GPU_ADAPTER: ${{ matrix.adapter }}
      OROGEN_GPU_PROFILE: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: npm ci
      - run: npm run test:gpu
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.name }}
          path: test-output
          if-no-files-found: ignore
