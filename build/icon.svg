<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The application icon of Orogen: a range rising from its foothills, on the application's own dark ground.
       build/icon.png and build/icon.ico are made from this file by build/make-icon.py. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3644"/>
      <stop offset="1" stop-color="#14181d"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c7a8"/>
      <stop offset="1" stop-color="#8f7a5e"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8196"/>
      <stop offset="1" stop-color="#465564"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbf4a"/>
      <stop offset="1" stop-color="#2f7d32"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="200" ry="200"/>
    </clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#ground)"/>
  <g clip-path="url(#tile)">
    <!-- the far range -->
    <path d="M 20 760 L 250 430 L 360 560 L 470 400 L 640 700 L 20 900 Z" fill="url(#far)"/>
    <!-- the main peak -->
    <path d="M 250 800 L 610 250 L 1010 800 Z" fill="url(#rock)"/>
    <!-- its shaded flank -->
    <path d="M 610 250 L 1010 800 L 690 800 L 640 560 Z" fill="#000000" fill-opacity="0.22"/>
    <!-- snow -->
    <path d="M 610 250 L 742 432 L 690 470 L 648 420 L 600 492 L 556 428 L 500 418 Z" fill="#ffffff"/>
    <!-- foothills -->
    <path d="M 0 800 C 170 640 300 690 420 760 C 560 840 700 690 860 730 C 950 752 1000 800 1024 830 L 1024 1024 L 0 1024 Z" fill="url(#grass)"/>
    <path d="M 0 890 C 220 800 380 880 560 900 C 740 920 880 850 1024 900 L 1024 1024 L 0 1024 Z" fill="#1f5f2a"/>
  </g>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="8"/>
</svg>
